# docker-compose.yml (skeleton — teammates fill in backend/db)
services:
  frontend:
    build: 
        context: ./frontend
        args:
          VITE_API_BASE_URL: /api
    ports:
      - "3000:80"
    depends_on:
      - backend  

  backend:
    build: ./backend
    ports:
      - "5001:5000"
    environment:
      - DB_HOST=db
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
   db_data: